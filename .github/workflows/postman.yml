name: API Contract (Postman)

# Boots a full Fleetbase stack (published image) and runs the FleetOps Postman
# collection against the live API. Delegates to the reusable workflow in
# fleetbase/fleetbase. Requires org secrets POSTMAN_API_KEY + _GITHUB_AUTH_TOKEN
# (inherited); no-ops until POSTMAN_API_KEY is set.
#
# Deliberately unpinned, like storefront's. The reusable workflow defaults to booting
# fleetbase/fleetbase@main against fleetbase/fleetbase-api:latest, so every release and
# every fix to the run order (scripts/ci/order-collection-requests.py) is picked up
# automatically, with no ref here to remember to bump. Each run records the image digest
# it actually resolved in its job summary, so a result stays traceable. To reproduce an
# older run:
#
#   with:
#     fleetbase-ref: v0.7.53
#     api-image: fleetbase/fleetbase-api:v0.7.53

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/v*', 'dev-v*']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  contract:
    # Laravel 12 release only. Remove `stack` once this release ships. The published image is
    # Laravel 10 and its extensions require core-api 1.x, so this branch can only resolve
    # against the whole Laravel 12 train: the `l12` stack builds the image from fleetbase's
    # Laravel 12 branch and links core-api and every extension from their release branches.
    uses: fleetbase/fleetbase/.github/workflows/api-contract.yml@main
    with:
      collections: "Fleetbase API"
      stack: l12
      build-from-source: false
      # Without this the run tests the version of fleetbase/fleetops-api baked into the
      # published image, not the branch under review. The workflow checks this
      # repository out at the commit under test and swaps it into the container.
      overlay-package: fleetbase/fleetops-api
    secrets: inherit
