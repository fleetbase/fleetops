fleet-ops:
  extension-name: Fleet-Ops

management:
  hub:
    eyebrow: Recursos
    title: Centro de recursos
    subtitle: Administra las personas, vehículos, ubicaciones, socios y registros operativos necesarios para organizar los despachos.
    action-queue: Acciones pendientes
    action-queue-description: Prioridad basada en la disponibilidad actual de los recursos.
    guides: Guías
    guides-description: Consulta la guía antes de cambiar la configuración de los recursos.
    read-guide: Consultar la guía de {resource}
    sections:
      people_assets:
        title: Personal y activos
        description: Mantén listos para las operaciones a los conductores, vehículos y grupos de flota disponibles para despacho.
      network:
        title: Red operativa
        description: Mantén al día los socios, contactos y lugares usados al crear y despachar pedidos.
      exceptions:
        title: Combustible e incidencias
        description: Revisa la actividad de combustible y las incidencias operativas antes de que afecten la calidad del servicio.
    links:
      drivers:
        label: Conductores
        description: Administra perfiles, asignaciones y horarios de conductores.
      vehicles:
        label: Vehículos
        description: Consulta vehículos, dispositivos vinculados, equipos y datos de servicio.
      fleets:
        label: Flotas
        description: Agrupa conductores y vehículos por equipo, región o tipo de servicio.
      vendors:
        label: Proveedores
        description: Socios de servicio vinculados con las operaciones.
      contacts:
        label: Contactos
        description: Registros de clientes y contactos para los flujos de pedidos.
      places:
        label: Lugares
        description: Ubicaciones, zonas y direcciones reutilizables.
      fuel-reports:
        label: Informes de combustible
        description: Revisa los informes de actividad y costos de combustible.
      fuel-transactions:
        label: Transacciones de combustible
        description: Consulta los detalles de las transacciones de combustible y sus datos de conciliación.
      issues:
        label: Incidencias
        description: Da seguimiento a incidentes, problemas de servicio y tareas pendientes.
    kpis:
      drivers:
        label: Conductores
        caption-ready: Hay perfiles de conductores disponibles para los despachos.
        caption-empty: Agrega perfiles de conductores antes de despachar trabajo.
        action: Administrar conductores
        loading: Cargando disponibilidad de recursos.
      vehicles:
        label: Vehículos
        caption-ready: Hay vehículos listos para asignación y seguimiento.
        caption-empty: Agrega vehículos para que puedan asignarse en los despachos.
        action: Consultar vehículos
        loading: Cargando cobertura de la flota.
      issues:
        label: Incidencias abiertas
        caption-ready: Revisa las incidencias antes de que afecten la calidad del servicio.
        caption-empty: No hay incidencias abiertas por el momento.
        action: Revisar incidencias
        loading: Cargando estado de las incidencias.
      fuel_records:
        label: Registros de combustible
        caption-ready: Hay actividad de combustible disponible para revisar.
        caption-empty: Los registros aparecerán cuando se agreguen informes o transacciones.
        action: Revisar registros de combustible
        loading: Cargando actividad de combustible.
    docs:
      drivers:
        label: conductores
        title: Guía de conductores
        description: Crea perfiles, accesos a la aplicación y datos operativos y de asignación de conductores.
      vehicles:
        label: vehículos
        title: Guía de vehículos
        description: Consulta los activos de la flota, su disponibilidad para asignación y sus datos operativos.
      fleets:
        label: flotas
        title: Guía de flotas
        description: Agrupa conductores y vehículos por equipo, región o cobertura de servicio.
      contacts:
        label: contactos
        title: Guía de contactos
        description: Administra las personas y organizaciones relacionadas con pedidos y registros operativos.
      places:
        label: lugares
        title: Guía de lugares
        description: Administra ubicaciones reutilizables de recogida, entrega, centros y establecimientos.
      issues:
        label: incidencias
        title: Guía de incidencias
        description: Da seguimiento a incidentes, problemas de servicio y tareas pendientes.
    actions:
      add_drivers:
        label: Agregar perfiles de conductores
        description: Se necesitan perfiles de conductores para asignar pedidos activos.
      add_vehicles:
        label: Agregar vehículos
        description: Los vehículos permiten realizar asignaciones, seguimiento y consultas de servicio.
      assign_vehicles_to_drivers:
        label: Asignar vehículos a conductores
        description: '{count, plural, one {# conductor no tiene} other {# conductores no tienen}} un vehículo asignado.'
      assign_drivers_to_vehicles:
        label: Asignar conductores a vehículos
        description: '{count, plural, one {# vehículo no tiene} other {# vehículos no tienen}} un conductor asignado.'
      attach_devices_to_vehicles:
        label: Vincular dispositivos a vehículos
        description: '{count, plural, one {# dispositivo está listo} other {# dispositivos están listos}} para vincularse a vehículos sin equipo telemático.'
      review_resource_issues:
        label: Revisar incidencias de vehículos y conductores
        description: '{count, plural, one {# incidencia está} other {# incidencias están}} vinculada(s) a conductores o vehículos.'
      review_issues:
        label: Revisar incidencias abiertas
        description: '{count, plural, one {# incidencia requiere} other {# incidencias requieren}} seguimiento.'
      prepare_vehicle_maintenance:
        label: Preparar el próximo mantenimiento
        description: '{count, plural, one {# programa de mantenimiento vehicular requiere} other {# programas de mantenimiento vehicular requieren}} planificación.'
      close_overdue_work_orders:
        label: Cerrar órdenes de trabajo vencidas
        description: '{count, plural, one {# orden de trabajo de recursos está} other {# órdenes de trabajo de recursos están}} vencida(s).'
      review_open_work_orders:
        label: Revisar órdenes de trabajo abiertas
        description: '{count, plural, one {# orden de trabajo de recursos está} other {# órdenes de trabajo de recursos están}} abiertas para vehículos o equipos.'
      replenish_low_stock_parts:
        label: Reabastecer piezas con poco inventario
        description: '{count, plural, one {# pieza en inventario está} other {# piezas en inventario están}} en el límite mínimo predeterminado o por debajo.'
      review_unmatched_fuel_transactions:
        label: Revisar transacciones de combustible sin conciliar
        description: '{count, plural, one {# transacción de combustible requiere} other {# transacciones de combustible requieren}} vincularse a un recurso.'
      create_fleets:
        label: Crear grupos de flota
        description: Agrupa conductores y vehículos activos por equipo, región o tipo de servicio.
      add_operating_places:
        label: Agregar lugares de operación
        description: Guarda ubicaciones frecuentes de recogida, entrega, establecimientos y servicio.
      add_service_vendors:
        label: Agregar proveedores de servicio
        description: Vincula proveedores de mantenimiento, servicios y operaciones con los recursos.
      add_contacts:
        label: Agregar contactos de operación
        description: Vincula clientes, socios y personal de servicio con los flujos de pedidos.
      review_fuel:
        label: Consultar registros de combustible
        description: La actividad de combustible aparecerá cuando se registren informes o transacciones.
      ready:
        label: Los recursos principales están listos
        description: Conductores, vehículos, incidencias y registros complementarios están en buen estado operativo.
  empty-states:
    customers:
      title: Agrega tu primer cliente
      description: Los clientes vinculan los pedidos con sus contactos y con el historial del servicio.
      filtered-title: Ningún cliente coincide con los filtros
      filtered-description: Ajusta la búsqueda o los filtros para encontrar otro cliente.
      primary-text: Nuevo cliente
    contacts:
